name: Bug report
description: Something behaves differently from the documented behaviour.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the exact error, route, or command.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "OS, Node/Rust version, browser, network (Testnet only)"
  - type: markdown
    attributes:
      value: "Never paste secret keys, Bearer secrets, PEM private keys, or database URLs. Report security issues privately as described in SECURITY.md."
